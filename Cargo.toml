[workspace]
members = ["crates/livox-protocol", "crates/livox-lvx", "crates/livox-transport", "crates/livox-device", "crates/livox-sim", "tools/lvx-info", "tools/virtual-lidar", "tools/livox-viewer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", default-features = false, features = ["std", "serde"] }
livox-protocol = { path = "crates/livox-protocol" }
livox-lvx = { path = "crates/livox-lvx" }
livox-transport = { path = "crates/livox-transport" }
livox-device = { path = "crates/livox-device" }
livox-sim = { path = "crates/livox-sim" }
